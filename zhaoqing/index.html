<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肇庆 · 旅行记录</title>
<style>
  :root{--paper:#f4f1e9;--ink:#241f18;--muted:#6f6757;--line:#ddd6c7;--accent:#9c5533;}
  @media (prefers-color-scheme:dark){
    :root{--paper:#17150f;--ink:#eae5d7;--muted:#968f7e;--line:#332f26;--accent:#d08a5f;}
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       line-height:1.85;}
  .wrap{max-width:720px;margin:0 auto;padding:56px 24px 96px;}
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;
        letter-spacing:.08em;margin-bottom:32px;}
  .back:hover{color:var(--accent);}
  h1{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.01em;
     line-height:1.15;margin:0 0 10px;}
  .meta{color:var(--muted);font-size:13px;letter-spacing:.06em;margin-bottom:44px;}
  .placeholder{border:1px solid var(--line);padding:28px;color:var(--muted);font-size:14.5px;}
  .placeholder code{background:var(--line);padding:2px 7px;font-size:13px;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 全部游记</a>
  <h1>肇庆</h1>
  <div class="meta">广东 · 待补充日期</div>
  <div class="placeholder">
    正文待写。替换本文件 <code>zhaoqing/index.html</code> 即可更新此页。
  </div>
</div>
</body>
</html>
