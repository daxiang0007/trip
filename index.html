<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行记录</title>
<style>
  :root{--paper:#f4f1e9;--ink:#241f18;--muted:#6f6757;--line:#ddd6c7;--accent:#9c5533;}
  @media (prefers-color-scheme:dark){
    :root{--paper:#17150f;--ink:#eae5d7;--muted:#968f7e;--line:#332f26;--accent:#d08a5f;}
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       line-height:1.85;}
  .wrap{max-width:720px;margin:0 auto;padding:72px 24px 96px;}
  h1{font-size:clamp(32px,7vw,50px);font-weight:800;letter-spacing:-.015em;
     line-height:1.1;margin:0 0 12px;}
  .sub{color:var(--muted);font-size:14px;letter-spacing:.06em;margin-bottom:52px;}
  .trips{border-top:1px solid var(--line);}
  .trip{display:flex;align-items:baseline;gap:16px;
        padding:20px 4px;border-bottom:1px solid var(--line);
        text-decoration:none;color:inherit;transition:padding-left .15s;}
  .trip:hover{padding-left:12px;}
  .trip:hover .name{color:var(--accent);}
  .name{font-size:19px;font-weight:700;letter-spacing:-.005em;flex-shrink:0;}
  .where{color:var(--muted);font-size:13.5px;flex:1;}
  .when{color:var(--muted);font-size:12.5px;letter-spacing:.06em;white-space:nowrap;}
  .empty{color:var(--muted);font-size:14px;padding:28px 4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>旅行记录</h1>
  <div class="sub">走过的地方</div>

  <div class="trips">
    <!-- TRIPS：新增游记时在下面按同样格式加一条 -->
    <a class="trip" href="zhaoqing/">
      <span class="name">肇庆</span>
      <span class="where">广东</span>
      <span class="when">—</span>
    </a>
    <a class="trip" href="hanoi/">
      <span class="name">河内</span>
      <span class="where">越南</span>
      <span class="when">两天一晚</span>
    </a>
    <!-- /TRIPS -->
  </div>
</div>
</body>
</html>
